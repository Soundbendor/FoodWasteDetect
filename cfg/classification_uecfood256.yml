cache_validation_embeddings: false
# One reference strategy per output directory. All paths resolve from the CWD.
dataset:
  name: uecfood256
  root: data/uecfood256
embed_images: false
n_imgs_per_class: null  # set the number of images 
embed_class_labels: false
embed_descriptions: true
# No UEC-Food256 vocabulary exists yet; null generates/reuses output_dir/descriptions.json.
descriptions_file: null
embedding:
  model_id: jinaai/jina-clip-v2
  device: cpu
  batch_size: 32
  # null keeps native dimensions; otherwise use an integer from 1 to the native size.
  # Changing this requires a fresh table/output directory and rebuilding all references.
  truncate_dim: null
ollama:
  llm: gemma3:27b
  binary_path: ollama
  host: http://127.0.0.1:11434
  startup_timeout: 120
  request_timeout: 600
lancedb:
  validation_table: null
  uri: assets/lancedb
  table: uecfood256_whole_image
k: 10
description_count: 5
output_dir: assets/classification/uecfood256
