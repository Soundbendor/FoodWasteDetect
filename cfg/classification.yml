# One reference strategy per output directory. All paths resolve from the CWD.
dataset:
  name: foodx251
  root: data/FoodX-251
embed_images: false
n_imgs_per_class: null  # set the number of images 
embed_class_labels: false
embed_descriptions: true
# Read-only vocabulary; null generates/reuses output_dir/descriptions.json.
descriptions_file: assets/classification/descriptions_v1/descriptions.json
embedding:
  model_id: jinaai/jina-clip-v2
  device: cpu
  batch_size: 32
  # null keeps native dimensions; otherwise use an integer from 1 to the native size.
  # Changing this requires a fresh table/output directory and rebuilding all references.
  truncate_dim: null
ollama:
  llm: gemma3:27b
  binary_path: ollama
  host: http://127.0.0.1:11434
  startup_timeout: 120
  request_timeout: 600
lancedb:
  uri: assets/lancedb
  table: foodx251_whole_image
  validation_table: null  # Sweep: null encodes validation images at each dimension.
dimension_sweep:
  source_dim: null  # Required for sweeps; dimension of the existing tables.
  dimensions: null  # Ordered target dimensions, each at most source_dim.
k: 10
description_count: 5
output_dir: assets/classification/descriptions_v1
