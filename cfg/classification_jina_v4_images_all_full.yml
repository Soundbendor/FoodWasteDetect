dataset:
  name: foodx251
  root: data/FoodX-251
embed_class_labels: false
embed_descriptions: false
embed_images: true
embedding:
  batch_size: 1
  device: cuda
  model_id: jinaai/jina-embeddings-v4
  truncate_dim: null
k: 10
lancedb:
  table: foodx251_jina_v4_images_all_full
