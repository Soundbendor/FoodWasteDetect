  validation_table: foodx251_jina_v4_validation_all_full
n_imgs_per_class: null
output_dir: assets/classification/jina_v4_images_all_full
cache_validation_embeddings: true
vector_dimension: 2048
sweep_dimensions:
- 128
- 256
- 512
- 768
- 1024
- 1536
- 2048
