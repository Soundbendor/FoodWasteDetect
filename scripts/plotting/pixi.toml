[workspace]
name = "matroyshka-plots"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
matplotlib-base = ">=3.10,<4"
pytest = ">=8,<10"

[tasks]
plot = { cmd = "python scripts/plot_matroyshka_sweep.py", cwd = "../.." }
test = { cmd = "pytest -q -o addopts='' tests/test_plot_matroyshka_sweep.py", cwd = "../.." }
