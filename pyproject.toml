[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "Intern-FW"
version = "0.0.1"
dependencies = [
    "sentence-transformers>=5.4,<6",
]

[project.scripts]
internvl = "internvl.cli:main"
build_clip_db = "app:build_img_vdb"
test_clip = "app:eval_img_vdb"
test_yolo = "yolo:main"

[tool.setuptools]
py-modules = ["app", "yolo", "util", "clip_finetune"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
internvl = ["scripts/*.sh"]
